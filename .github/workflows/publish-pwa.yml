name: Publish PWA

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/publish-pwa.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PWA overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout upstream WebPage
        uses: actions/checkout@v4
        with:
          repository: bmorcelli/Launcher
          ref: WebPage
          path: webpage

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webpage/package-lock.json

      - name: Install site dependencies
        working-directory: webpage
        run: npm ci

      - name: Generate flasher.json from origin releases
        working-directory: webpage
        env:
          CI: "true"
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_flasher_json.py

      - name: Build site
        working-directory: webpage
        run: npm run build

      - name: Record upstream revision
        id: upstream
        run: echo "sha=$(git -C webpage rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Inject installable PWA
        env:
          PWA_BUILD_ID: ${{ steps.upstream.outputs.sha }}-${{ github.run_id }}
        run: node overlay/site/inject-pwa.mjs webpage/build

      - name: Set custom domain
        run: cp overlay/site/CNAME webpage/build/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webpage/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
